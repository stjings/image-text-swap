<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이미지 텍스트 교체 툴</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- 조작은 전부 여기 모아 고정한다. 스크롤과 무관하게 항상 같은 자리에 있다. -->
<header class="topbar">
  <h1>이미지 텍스트 교체 툴</h1>

  <div class="tools">
    <button id="pickBtn" class="btn" type="button">파일 선택</button>
    <span id="fileName" class="filename"></span>
    <input id="fileInput" type="file" accept="image/png,image/jpeg" hidden>

    <span class="sep"></span>

    <label class="field">
      <span>폰트</span>
      <select id="fontSelect" aria-label="폰트" disabled></select>
    </label>
    <button id="localFontBtn" class="btn btn-ghost" type="button"
            title="이 PC에 설치된 폰트를 판별 후보에 추가합니다">＋ 내 PC 폰트</button>

    <span class="sep"></span>

    <span id="dirtyCount" class="dirtycount"></span>
    <button id="downloadBtn" class="btn btn-primary" type="button" disabled>PNG 다운로드</button>
    <button id="resetBtn" class="btn btn-ghost" type="button" hidden>초기화</button>
  </div>
</header>

<main class="layout">

  <section class="pane pane-main">
    <div class="pane-head">
      <div class="seg" id="bgToggle" role="group" aria-label="미리보기 배경">
        <button type="button" data-bg="checker" class="on">체커보드</button>
        <button type="button" data-bg="light">흰색</button>
        <button type="button" data-bg="dark">검정</button>
      </div>
      <div class="viewtools">
        <button id="regionsBtn" class="btn btn-toggle on" type="button" disabled
                title="편집 가능한 영역을 모두 표시합니다">영역 표시</button>
        <button id="toggleBtn" class="btn" type="button" disabled>원본 보기</button>
      </div>
    </div>

    <div id="stage" class="stage bg-checker">
      <div id="dropzone" class="dropzone">
        <p class="dz-title">이미지를 끌어다 놓으세요</p>
        <p class="dz-sub">또는 <button id="pickBtn2" class="linkbtn" type="button">파일 선택</button></p>
        <p class="dz-note">PNG · JPG · 이미지는 브라우저 밖으로 나가지 않습니다</p>
      </div>
      <div id="viewport" class="viewport" hidden>
        <canvas id="preview"></canvas>
        <div id="overlay" class="overlay"></div>
      </div>
    </div>

    <p id="notes" class="notes" hidden></p>
  </section>

  <aside class="pane pane-side">
    <div class="pane-head">
      <span class="pane-title">텍스트 블록</span>
      <span id="blockCount" class="count">—</span>
    </div>
    <p id="status" class="status" hidden></p>
    <div id="filterBar" class="filterbar" hidden>
      <button type="button" data-filter="all" class="on">전체</button>
      <button type="button" data-filter="editable">편집 가능</button>
      <button type="button" data-filter="dirty">수정됨</button>
    </div>
    <div id="blockList" class="blocklist" tabindex="0">
      <p class="placeholder">이미지를 올리면 검출된 텍스트 블록이 여기에 표시됩니다.</p>
    </div>

    <div id="editor" class="editor" hidden>
      <div class="editor-head">
        <span id="editorTitle" class="pane-title">선택한 블록</span>
        <button id="editorClose" class="iconbtn" type="button" aria-label="선택 해제">✕</button>
      </div>
      <p id="editorOrig" class="editor-orig"></p>
      <textarea id="editorText" rows="3" aria-label="문구 편집"
                placeholder="문구를 입력하세요"></textarea>
      <div class="editor-actions">
        <span id="editorHint" class="editor-hint"></span>
        <button id="revertBtn" class="btn btn-ghost" type="button">되돌리기</button>
        <button id="saveBtn" class="btn btn-primary" type="button">저장</button>
      </div>
    </div>
  </aside>

</main>

<!-- 정보는 읽기용이므로 아래에 고정한다. 이미지 높이와 무관하게 자리가 안 움직인다. -->
<footer class="bottombar">
  <dl id="imgInfo" class="info">
    <div><dt>이미지</dt><dd class="dim">아직 없음</dd></div>
  </dl>
</footer>

<!-- 내 PC 폰트 고르기.
     유료 폰트는 저장소에 넣을 수 없으므로, 산 사람의 PC에 설치된 것을 그
     자리에서 불러 쓴다. 폰트 파일은 어디로도 전송되지 않는다. -->
<div id="lfBackdrop" class="lf-backdrop" hidden></div>
<section id="lfPanel" class="lf-panel" hidden aria-label="내 PC 폰트">
  <div class="lf-head">
    <span class="pane-title">내 PC 폰트</span>
    <button id="lfClose" class="iconbtn" type="button" aria-label="닫기">✕</button>
  </div>

  <p class="lf-note">
    여기서 고른 폰트는 <b>자동판별 후보</b>에 들어갑니다. 폰트 파일은 이 PC 밖으로
    나가지 않고, 앱에도 저장되지 않습니다. 이미지를 받는 다른 사람에게는 결과
    그림만 전달되므로 폰트가 함께 배포되지 않습니다.
  </p>

  <div id="lfAdded" class="lf-added"></div>

  <div class="lf-row">
    <button id="lfScan" class="btn btn-ghost" type="button">설치된 폰트 목록에서 고르기</button>
  </div>
  <input id="lfFilter" type="search" placeholder="목록 검색 (예: 산돌, Sandoll)"
         aria-label="폰트 검색" hidden>
  <div id="lfList" class="lf-list" hidden></div>

  <p class="lf-sub">이름을 안다면 바로 적어 넣어도 됩니다.</p>
  <div class="lf-row">
    <input id="lfName" type="text" placeholder="폰트 이름 (예: Sandoll GyeokdongGothic)"
           aria-label="폰트 이름">
    <button id="lfAdd" class="btn" type="button">추가</button>
  </div>
  <p id="lfMsg" class="lf-msg" hidden></p>
</section>

<script src="./vendor/tesseract/tesseract.min.js"></script>
<script src="./js/detect.js"></script>
<script src="./js/ocr.js"></script>
<script src="./js/compose.js"></script>
<script src="./js/localfont.js"></script>
<script src="./js/fontmatch.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
