<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이미지 텍스트 교체 툴</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="topbar">
  <h1>이미지 텍스트 교체 툴</h1>
  <div class="topbar-right">
    <span id="fileName" class="filename"></span>
    <button id="pickBtn" class="btn" type="button">파일 선택</button>
    <button id="resetBtn" class="btn btn-ghost" type="button" hidden>초기화</button>
    <input id="fileInput" type="file" accept="image/png,image/jpeg" hidden>
  </div>
</header>

<main class="layout">

  <section class="pane pane-main">
    <div class="pane-head">
      <span class="pane-title">미리보기</span>
      <div class="seg" id="bgToggle" role="group" aria-label="미리보기 배경">
        <button type="button" data-bg="checker" class="on">체커보드</button>
        <button type="button" data-bg="light">흰색</button>
        <button type="button" data-bg="dark">검정</button>
      </div>
    </div>

    <div id="stage" class="stage bg-checker">
      <div id="dropzone" class="dropzone">
        <p class="dz-title">이미지를 끌어다 놓으세요</p>
        <p class="dz-sub">또는 <button id="pickBtn2" class="linkbtn" type="button">파일 선택</button></p>
        <p class="dz-note">PNG · JPG · 이미지는 브라우저 밖으로 나가지 않습니다</p>
      </div>
      <div id="viewport" class="viewport" hidden>
        <canvas id="preview"></canvas>
        <div id="overlay" class="overlay"></div>
      </div>
    </div>

    <p id="notes" class="notes" hidden></p>
    <dl id="imgInfo" class="info" hidden></dl>
  </section>

  <aside class="pane pane-side">
    <div class="pane-head">
      <span class="pane-title">텍스트 블록</span>
      <span id="blockCount" class="count">—</span>
    </div>
    <p id="status" class="status" hidden></p>
    <div id="filterBar" class="filterbar" hidden>
      <button type="button" data-filter="all" class="on">전체</button>
      <button type="button" data-filter="editable">편집 가능</button>
      <button type="button" data-filter="dirty">수정됨</button>
    </div>
    <div id="blockList" class="blocklist" tabindex="0">
      <p class="placeholder">이미지를 올리면 검출된 텍스트 블록이 여기에 표시됩니다.</p>
    </div>

    <div id="editor" class="editor" hidden>
      <div class="editor-head">
        <span id="editorTitle" class="pane-title">선택한 블록</span>
        <button id="editorClose" class="iconbtn" type="button" aria-label="선택 해제">✕</button>
      </div>
      <p id="editorOrig" class="editor-orig"></p>
      <textarea id="editorText" rows="3" aria-label="문구 편집"
                placeholder="문구를 입력하세요"></textarea>
      <div class="editor-actions">
        <span id="editorHint" class="editor-hint"></span>
        <button id="revertBtn" class="btn btn-ghost" type="button">되돌리기</button>
        <button id="saveBtn" class="btn btn-primary" type="button">저장</button>
      </div>
    </div>
  </aside>

</main>

<footer class="bottombar">
  <fieldset id="fontMode" class="fontmode" disabled>
    <legend class="sr-only">폰트 처리</legend>
    <label><input type="radio" name="fontmode" value="auto" checked> 자동판별에 맡기기</label>
    <label><input type="radio" name="fontmode" value="manual"> 직접 선택</label>
    <select id="fontSelect" aria-label="폰트 선택" disabled></select>
  </fieldset>
  <div class="bottom-right">
    <span id="dirtyCount" class="dirtycount"></span>
    <button id="composeBtn" class="btn" type="button" disabled>수정 요청</button>
    <button id="toggleBtn" class="btn btn-ghost" type="button" disabled>원본 / 결과</button>
    <button id="downloadBtn" class="btn btn-primary" type="button" disabled>PNG 다운로드</button>
  </div>
</footer>

<script src="./vendor/tesseract/tesseract.min.js"></script>
<script src="./js/detect.js"></script>
<script src="./js/ocr.js"></script>
<script src="./js/compose.js"></script>
<script src="./js/fontmatch.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
