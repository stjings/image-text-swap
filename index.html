<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이미지 텍스트 교체 툴</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="topbar">
  <h1>이미지 텍스트 교체 툴</h1>
  <div class="topbar-right">
    <span id="fileName" class="filename"></span>
    <button id="pickBtn" class="btn" type="button">파일 선택</button>
    <button id="resetBtn" class="btn btn-ghost" type="button" hidden>초기화</button>
    <input id="fileInput" type="file" accept="image/png,image/jpeg" hidden>
  </div>
</header>

<main class="layout">

  <section class="pane pane-main">
    <div class="pane-head">
      <span class="pane-title">미리보기</span>
      <div class="seg" id="bgToggle" role="group" aria-label="미리보기 배경">
        <button type="button" data-bg="checker" class="on">체커보드</button>
        <button type="button" data-bg="light">흰색</button>
        <button type="button" data-bg="dark">검정</button>
      </div>
    </div>

    <div id="stage" class="stage bg-checker">
      <div id="dropzone" class="dropzone">
        <p class="dz-title">이미지를 끌어다 놓으세요</p>
        <p class="dz-sub">또는 <button id="pickBtn2" class="linkbtn" type="button">파일 선택</button></p>
        <p class="dz-note">PNG · JPG · 이미지는 브라우저 밖으로 나가지 않습니다</p>
      </div>
      <div id="viewport" class="viewport" hidden>
        <canvas id="preview"></canvas>
        <div id="overlay" class="overlay"></div>
      </div>
    </div>

    <dl id="imgInfo" class="info" hidden></dl>
  </section>

  <aside class="pane pane-side">
    <div class="pane-head">
      <span class="pane-title">텍스트 블록</span>
      <span id="blockCount" class="count">—</span>
    </div>
    <div id="blockList" class="blocklist">
      <p class="placeholder">
        이미지를 올리면 검출된 텍스트 블록이 여기에 표시됩니다.
        <small>블록 검출과 OCR은 M2에서 붙습니다.</small>
      </p>
    </div>
  </aside>

</main>

<footer class="bottombar">
  <fieldset class="fontmode" disabled>
    <legend class="sr-only">폰트 처리</legend>
    <label><input type="radio" name="fontmode" value="auto" checked> 자동판별에 맡기기</label>
    <label><input type="radio" name="fontmode" value="manual"> 직접 선택</label>
    <select id="fontSelect" aria-label="폰트 선택"><option>Noto Sans KR</option></select>
  </fieldset>
  <div class="bottom-right">
    <button class="btn" type="button" disabled>수정 요청</button>
    <button class="btn btn-ghost" type="button" disabled>원본 / 결과</button>
    <button class="btn btn-primary" type="button" disabled>PNG 다운로드</button>
  </div>
</footer>

<script src="./js/app.js"></script>
</body>
</html>
