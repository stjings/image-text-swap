# GitHub Pages 배포.
#
# configure-pages 의 enablement 로 Pages 를 자동으로 켠다. 저장소 설정을
# 손으로 바꾸지 않아도 된다. 권한이 부족해 실패하면 그때는 수동으로
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# 로 바꿔 주어야 한다.
#
# 검증용 디렉터리(tools/ · spike/ · assets/)는 배포물에서 뺀다.
# 앱 동작에 필요 없고 3.7MB를 차지한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/plan-analysis-explanation-r1s6j1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 배포물 추리기
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r css js fonts vendor _site/
          du -sh _site
          # 배포물에 무엇이 들어갔는지 로그에 남긴다. "고쳤는데 화면이 그대로"일 때
          # 코드 문제인지 배포 문제인지 여기서 갈린다.
          ls -l _site/js

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # upload-pages-artifact 대신 tar + upload-artifact 를 직접 쓴다.
      #
      # 9번째 실행이 이걸로 죽었다:
      #   Error: Multiple artifacts named "github-pages" were unexpectedly
      #   found for this workflow run. Artifact count is 2.
      # 15MB 를 올리느라 finalize 가 27초 걸렸고, 그 사이 업로드가 재시도되면서
      # 같은 이름의 아티팩트가 두 개 등록됐다. deploy-pages 는 이름이 하나일 것을
      # 전제하므로 그대로 실패한다. upload-pages-artifact@v3 는 이 상황을 막을
      # 손잡이(overwrite)를 노출하지 않아, 한 번 이렇게 되면 재실행으로도 못 푼다.
      #
      # 아래 tar 명령은 upload-pages-artifact@v3 가 내부에서 하는 것과 같다.
      # 다른 점은 overwrite: true 하나 — 같은 이름이 이미 있으면 지우고 올린다.
      - name: 배포물 묶기
        run: |
          tar --dereference --hard-dereference \
              --directory _site \
              -cf "$RUNNER_TEMP/artifact.tar" \
              --exclude=.git --exclude=.github .

      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - id: deploy
        uses: actions/deploy-pages@v4
